<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bride Portal — Atelier</title>
  <meta name="description" content="Log in to the Atelier Bride Portal to track fittings, alterations and payments.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    .auth-back {
      position: fixed;
      top: calc(var(--spacing-3) + 10px);
      left: var(--gutter);
      z-index: 5;
      font-size: .7rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .auth-back:hover { color: var(--accent-color); }
  </style>
</head>
<body>

  <a href="index.html" class="auth-back"><i class="ph-light ph-arrow-left"></i> Back to Atelier</a>

  <div class="auth-toggles">
    <button class="icon-btn theme-toggle" aria-label="Toggle theme"><i class="ph-light ph-moon"></i></button>
    <button class="icon-btn rtl-toggle" aria-label="Toggle text direction"><i class="ph-light ph-arrows-left-right"></i></button>
  </div>

  <div class="auth-wrapper">
    <div class="auth-box fade-in">

      <a href="index.html" class="nav-logo auth-brand"><img src="assets/images/atelier-logo.svg" alt="Atelier Bridal Salon" class="logo-img" width="197" height="40"></a>

      <h2>Welcome Back</h2>
      <p>Log in to manage your fittings, alterations and payments.</p>

      <form action="dashboard.html" method="GET" class="needs-validation" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrap">
            <input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required>
            <button type="button" class="password-toggle" data-target="password" aria-label="Show password" aria-pressed="false">
              <i class="ph-light ph-eye"></i>
            </button>
          </div>
        </div>

        <div class="auth-row">
          <label class="check-inline" for="remember">
            <input type="checkbox" id="remember" name="remember"> Remember me
          </label>
          <a href="#" class="auth-link">Forgot password?</a>
        </div>

        <p class="form-error-msg" style="display: none; margin-bottom: 16px;">Please enter your email and password.</p>

        <button type="submit" class="btn btn-primary btn-block btn-lg">Log in to Account</button>
      </form>

      <div class="divider-or">or</div>

      <div class="social-auth">
        <button type="button" class="btn-social"><svg class="brand-icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path fill="#FFC107" d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z"/><path fill="#FF3D00" d="m6.306 14.691 6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z"/><path fill="#4CAF50" d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238A11.91 11.91 0 0 1 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z"/><path fill="#1976D2" d="M43.611 20.083H42V20H24v8h11.303a12.04 12.04 0 0 1-4.087 5.571l.003-.002 6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z"/></svg> Continue with Google</button>
        <button type="button" class="btn-social"><i class="ph-fill ph-apple-logo"></i> Continue with Apple</button>
      </div>

      <p style="margin-top: var(--spacing-4); font-size: .9rem; color: var(--muted);">
        Don't have an account? <a href="register.html" class="auth-link" style="font-weight: 500;">Register here</a>
      </p>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
